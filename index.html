<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111827">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    

    <title>My Expenses</title>
</head>

<body>

<div class="app">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <header>
        <h1>My Expenses</h1>
        <p>Personal purchase tracker</p>
    </header>

    <div class="summary">

        <div class="summary-card">
            <span>Total Spent</span>
            <strong id="total">$0.00</strong>
        </div>

        <div class="summary-card">
            <span>Items</span>
            <strong id="count">0</strong>
        </div>

    </div>

    <form id="expenseForm">

        <input
            id="item"
            type="text"
            placeholder="Item name"
            required
        >

        <div class="row">

            <input
                id="price"
                type="number"
                step="0.01"
                min="0"
                placeholder="Price"
                required
            >

            <input
                id="date"
                type="date"
                required
            >

        </div>

        <input
            id="category"
            type="text"
            placeholder="Category"
        >

        <input
            id="store"
            type="text"
            placeholder="Store"
        >

        <textarea
            id="notes"
            placeholder="Notes"
        ></textarea>

        <button type="submit">
            Add Expense
        </button>

    </form>

    <div class="toolbar">

        <input
            id="search"
            type="search"
            placeholder="Search expenses..."
        >

        <button
            id="clearAll"
            class="danger"
            type="button"
        >
            Clear All
        </button>

    </div>

    <section id="expenses"></section>

</div>

<script src="app.js"></script>

</body>
</html>
